services:
  bili-recorder:
    build: .
    container_name: bili-recorder
    network_mode: host
    restart: always
    volumes:
      - ./config.ini:/app/config.ini:ro
      - ./recordings:/app/recordings
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import json,time,sys; d=json.load(open(\"/app/status.json\",\"r\",encoding=\"utf-8\")); sys.exit(0 if time.time()-float(d.get(\"heartbeat_ts\",0))<180 else 1)' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"  # 每个日志文件最大 10MB
        max-file: "3"    # 最多保留 3 个旧日志文件（超过会自动删最早的）
