services:
  bili-recorder:
    build:
      context: .
      network: host
    init: true
    restart: always
    volumes:
      - ./config:/app/config:ro
      - ./recordings:/app/recordings
      - ./.runtime:/app/.runtime
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "bili-recorder", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"  # 每个日志文件最大 10MB
        max-file: "3"    # 最多保留 3 个旧日志文件（超过会自动删最早的）
