[General]
# 监控的房间号，必须改成真实值后再启动
RoomId = 0
# 检查间隔（秒）
CheckInterval = 60
# 录制文件保存路径（相对于项目目录）
SaveDir = ./recordings
# 最低可用磁盘空间（GB），低于该值将跳过新录制任务；0 表示关闭
MinFreeSpaceGB = 5

[Recording]
# 视频编码器: copy (直接保存原始流，最稳), libx264, libx265
VideoEncoder = copy
# 视频质量（copy 模式下此参数无效）
VideoQuality = 23
# 音频编码: copy (保持原样)
AudioEncoder = copy
# 录制格式: mp4, flv, mkv
Format = flv
# 录制卡死判定：输出文件在该秒数内无增长则中断并自恢复
StallTimeoutSeconds = 300
# 单次录制最大时长（秒），0 表示不限制
MaxRecordDurationSeconds = 0
# 录制进程轮询间隔（秒）
ProcessPollIntervalSeconds = 5
# 异常后最大自恢复次数
MaxRecoverRetries = 2
# 每次自恢复前等待秒数
RecoverDelaySeconds = 15

[PostProcess]
# 是否启用录后离线转码（默认开启）
TranscodeEnabled = true
# 自动优先使用 AV1 NVENC；不可用时使用 CPU AV1
AutoPreferNvenc = true
# NVENC 主编码器（需要支持 AV1 编码的 NVIDIA GPU）
NvencVideoEncoder = av1_nvenc
# NVENC 主编码器 CQ（越小越清晰）
NvencQuality = 34
# NVENC 主编码器预设
NvencPreset = p5
# 留空：AV1 不可用时保留原流，不回退到其他编码格式
NvencFallbackVideoEncoder =
# NVENC 回退编码器 CQ
NvencFallbackQuality = 23
# NVENC 回退编码器预设
NvencFallbackPreset = p4
# CPU 主编码器（SVT-AV1）
VideoEncoder = libsvtav1
# AV1 CRF（越小越清晰、文件越大；34 作为压缩起点）
VideoQuality = 34
# SVT-AV1 预设（0~13，越大越快）
Preset = 6
# 输出 MP4 并前置索引，便于网页播放和拖动进度
OutputFormat = mp4
# 是否保留原始录制文件（默认 false：校验通过后删除）
KeepSource = false
# 转码结果最小有效时长（秒），用于校验产物是否可用
MinValidDurationSeconds = 3
# 留空：编码失败保留源文件
FallbackVideoEncoder =
# 回退编码器质量参数
FallbackVideoQuality = 23
# 回退编码器预设
FallbackPreset = medium
# CPU 转码线程上限（建议 1~4）
CpuThreads = 2
# 启用 nice 降低 CPU 调度优先级
UseNice = true
# nice 值（0~19，越大越低优先级）
NiceLevel = 10
# 启用 ionice 降低磁盘 IO 优先级
UseIonice = true

[Maintenance]
# 是否启用录制文件清理
CleanupEnabled = true
# 保留最近 N 天的录制（0 表示不按天数清理）
KeepDays = 0
# 最多保留 N 个录制文件（0 表示不按数量清理）
KeepCount = 200
# 仅已完成的顶层 MP4 参与清理；原流、分段和临时产物受保护
CleanupExtensions = mp4

[Upload]
# 通过宿主机 quark-upload.timer 上传校验完成的最终 MP4；本地文件保留
Enabled = false
# 先安装并授权官方 quarkclouddrive CLI
QuarkCli = /path/to/quark-drive.cjs
Node = node
# 留空使用夸克工具默认目录；填用户指定的目录 FID
ParentFid =
# 可选：AList 专用账号凭据 JSON 的绝对路径；开启后以本地最终视频为准同步改名和删除
# JSON 含 url、username、password，文件权限应为 600；账号基本路径必须限制为同一目标目录
AlistCredentials =
