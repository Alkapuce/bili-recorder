[General]
# 监控的房间号，必须改成真实值后再启动
RoomId = 0
# 检查间隔（秒）
CheckInterval = 60
# 录制文件保存路径（相对于项目目录）
SaveDir = ./recordings
# 最低可用磁盘空间（GB），低于该值将跳过新录制任务；0 表示关闭
MinFreeSpaceGB = 5

[Recording]
# 视频编码器: copy (直接保存原始流，最稳), libx264, libx265
VideoEncoder = copy
# 视频质量（copy 模式下此参数无效）
VideoQuality = 23
# 音频编码: copy (保持原样)
AudioEncoder = copy
# 录制格式: mp4, flv, mkv
Format = flv
# 录制卡死判定：输出文件在该秒数内无增长则中断并自恢复
StallTimeoutSeconds = 300
# 单次录制最大时长（秒），0 表示不限制
MaxRecordDurationSeconds = 0
# 录制进程轮询间隔（秒）
ProcessPollIntervalSeconds = 5
# 异常后最大自恢复次数
MaxRecoverRetries = 2
# 每次自恢复前等待秒数
RecoverDelaySeconds = 15

[PostProcess]
# 是否启用录后离线转码（默认开启）
TranscodeEnabled = true
# 自动优先使用 NVENC；容器内探测不可用时自动回退 CPU
AutoPreferNvenc = true
# NVENC 主编码器（推荐 HEVC）
NvencVideoEncoder = hevc_nvenc
# NVENC 主编码器 CQ（越小越清晰）
NvencQuality = 28
# NVENC 主编码器预设
NvencPreset = p4
# NVENC 回退编码器（GPU 可见但 HEVC NVENC 不可用时）
NvencFallbackVideoEncoder = h264_nvenc
# NVENC 回退编码器 CQ
NvencFallbackQuality = 23
# NVENC 回退编码器预设
NvencFallbackPreset = p4
# CPU 主编码器（默认 libx265）
VideoEncoder = libx265
# 主编码器质量参数（x265/x264 对应 CRF，越小越清晰体积越大）
VideoQuality = 28
# 主编码器预设
Preset = medium
# 输出格式（推荐 mkv）
OutputFormat = mkv
# 是否保留原始录制文件（默认 false：校验通过后删除）
KeepSource = false
# 转码结果最小有效时长（秒），用于校验产物是否可用
MinValidDurationSeconds = 3
# 回退编码器
FallbackVideoEncoder = libx264
# 回退编码器质量参数
FallbackVideoQuality = 23
# 回退编码器预设
FallbackPreset = medium
# CPU 转码线程上限（建议 1~4）
CpuThreads = 2
# 启用 nice 降低 CPU 调度优先级
UseNice = true
# nice 值（0~19，越大越低优先级）
NiceLevel = 10
# 启用 ionice 降低磁盘 IO 优先级
UseIonice = true

[Maintenance]
# 是否启用录制文件清理
CleanupEnabled = true
# 保留最近 N 天的录制（0 表示不按天数清理）
KeepDays = 0
# 最多保留 N 个录制文件（0 表示不按数量清理）
KeepCount = 200
# 参与清理的扩展名（逗号分隔）
CleanupExtensions = flv,mp4,mkv
